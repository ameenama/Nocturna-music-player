<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;600;700&family=Tenor+Sans&display=swap" rel="stylesheet">
</head>
<body>
    <video class="bg-video" autoplay muted loop playsinline>
        <source src="{{ url_for('static', filename='bgvdo.mp4') }}" type="video/mp4">
    </video>

    <header class="topbar">
        <div class="logo">
            <img src="{{ url_for('static', filename='logo.jpeg') }}" alt="Nocturna">
        </div>
    </header>

    <div class="form-container">
        <h2>NOCTURNA</h2>
        <div class="card">
            <p class="card-heading">SIGN IN TO YOUR ACCOUNT</p>

            {% if error %}
                <p style="color: red; text-align: center;">{{ error }}</p>
            {% endif %}

            <form action="/login" method="POST">
                <div class="field-group">
                    <label for="fname">Username</label>
                    <input type="text" id="fname" name="fname" placeholder="Enter your username" required>
                </div>

                <div class="field-group">
                    <label for="lpass">Password</label>
                    <input type="password" id="lpass" name="lpass" placeholder="Enter your password" required>
                </div>

                <input type="submit" value="LOGIN">

                <div class="divider">OR</div>

                <button type="button" class="btn-google">
                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google">
                    Continue with Google
                </button>
            </form>

            <p class="register-link">Don't have an account? <a href="/register">Register</a></p>
        </div>
    </div>
</body>
</html>
