<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
</head>
<body>

<div class="admin-container">

    <aside class="sidebar">
        <div class="sidebar-logo">
            <img src="{{ url_for('static', filename='logo.jpeg') }}" alt="Nocturna">
            <span>Nocturna</span>
        </div>
        <nav class="sidebar-nav">
            <a href="/admin" class="nav-item active">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
                Users
            </a>
        </nav>
        <a href="/logout" class="sidebar-logout">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Logout
        </a>
    </aside>

    <main class="main">
        <div class="topbar">
            <h1 class="page-title">Edit User</h1>
        </div>

        <section class="section" style="max-width: 480px;">
            {% if error %}
            <p class="form-error">{{ error }}</p>
            {% endif %}
            <form method="post" class="edit-form">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" value="{{ user.username }}" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" value="{{ user.email or '' }}" placeholder="No email set">
                </div>
                <div class="edit-actions">
                    <button type="submit" class="btn-save">Save Changes</button>
                    <a href="/admin" class="btn-cancel">Cancel</a>
                </div>
            </form>
        </section>
    </main>
</div>

</body>
</html>
